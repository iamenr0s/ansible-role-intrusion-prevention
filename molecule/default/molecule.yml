---
role_name_check: 1
dependency:
  name: galaxy
  options:
    ignore-errors: true
driver:
  name: podman
platforms:
- name: instance
  image: docker.io/iamenr0s/docker-${MOLECULE_DISTRO:-almalinux9}-ansible:latest
  command: ${MOLECULE_DOCKER_COMMAND:-""}
  volumes:
  - /sys/fs/cgroup:/sys/fs/cgroup:rw
  privileged: true
  pre_build_image: true
  extra_opts:
  - --cgroupns=host
provisioner:
  name: ansible
  playbooks:
    converge: ${MOLECULE_PLAYBOOK:-converge.yml}
scenario:
  # check runs on the configured host: a fresh image may have no apt lists for check mode to resolve fail2ban.
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - verify
    - cleanup
    - destroy
