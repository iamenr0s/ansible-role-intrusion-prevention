---
- name: Converge (remediation must be refused without confirmation)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Try to remediate without confirming
      block:
        - name: Remediate unconfirmed
          ansible.builtin.include_role:
            name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
          vars:
            linux_hardening_mode: remediate
        - name: Fail if the role did not refuse
          ansible.builtin.fail:
            msg: Role remediated without confirmation.
      rescue:
        - name: Assert the refusal came from the confirmation check
          ansible.builtin.assert:
            that: "'confirm_remediation' in ansible_failed_result.msg"
            quiet: true

- name: Converge (EL without EPEL consent must not fail or install anything)
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Remediate confirmed, without the EPEL switch
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."  # noqa: role-name[path]
      vars:
        linux_hardening_mode: remediate
        linux_hardening_confirm_remediation: true
      when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Fedora'

    - name: Look for the package
      ansible.builtin.command: rpm -q fail2ban  # noqa command-instead-of-module
      register: __rpm
      changed_when: false
      failed_when: false
      when: ansible_facts['os_family'] == 'RedHat' and ansible_facts['distribution'] != 'Fedora'

    - name: Nothing was installed
      ansible.builtin.assert:
        that: __rpm.rc == 1
        quiet: true
      when: __rpm is not skipped
