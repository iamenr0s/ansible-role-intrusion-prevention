---
- name: audit | Gather fail2ban state
  ansible.builtin.include_tasks: facts.yml

- name: audit | Compare with desired state
  ansible.builtin.set_fact:
    linux_hardening_ips_findings: >-
      {{ [__lh_ips_checks | selectattr('failing') | map(attribute='finding') | list,
          (__lh_ips_action_findings | from_json) if __lh_ips_jail_ok else []] | flatten(levels=1) }}
  vars:
    __lh_ips_state: "{{ __lh_ips_unit.status | default({}) }}"
    __lh_ips_running: "{{ __lh_ips_installed and not (__lh_ips_container | bool) }}"
    __lh_ips_active: "{{ __lh_ips_state.ActiveState | default('') == 'active' }}"
    __lh_ips_jail_ok: "{{ __lh_ips_running and __lh_ips_active and __lh_ips_jail.rc | default(1) == 0 }}"
    __lh_ips_can_install: >-
      {{ ansible_facts['os_family'] == 'Debian' or ansible_facts['distribution'] == 'Fedora'
         or (linux_hardening_ips_enable_epel | bool) }}
    # One entry per check; a finding is reported when its check is failing.
    __lh_ips_checks:
      - failing: "{{ not __lh_ips_installed }}"
        finding:
          key: package fail2ban
          expected: installed
          actual: >-
            missing{{ '' if __lh_ips_can_install else
            ' (reported only: it is in EPEL on EL, set linux_hardening_ips_enable_epel)' }}
          fixable: "{{ __lh_ips_can_install }}"
      - failing: >-
          {{ __lh_ips_installed and (__lh_ips_file.content is not defined
             or (__lh_ips_file.content | b64decode) != __lh_ips_content
             or __lh_ips_stat.stat.mode != '0644') }}
        finding:
          key: "jail drop-in {{ linux_hardening_ips_dropin }}"
          expected: present (0644) with the desired settings
          actual: missing or different
          fixable: true
      - failing: "{{ __lh_ips_installed and __lh_ips_state.UnitFileState | default('') not in ['enabled', 'static'] }}"
        finding:
          key: fail2ban.service enabled
          expected: enabled
          actual: "{{ __lh_ips_state.UnitFileState | default('unknown') }}"
          fixable: true
      - failing: "{{ __lh_ips_installed and (__lh_ips_container | bool) }}"
        finding:
          key: fail2ban running
          expected: active
          actual: "not started in a container: bans would change the host firewall (files only)"
          fixable: false
      - failing: "{{ __lh_ips_running and not __lh_ips_active }}"
        finding:
          key: fail2ban.service active
          expected: running
          actual: "{{ __lh_ips_state.ActiveState | default('unknown') }}"
          fixable: true
      - failing: "{{ __lh_ips_running and __lh_ips_active and __lh_ips_jail.rc | default(1) != 0 }}"
        finding:
          key: sshd jail running
          expected: active
          actual: not found by fail2ban-client
          fixable: true
    # A ban action works only if its firewall backend does; the first matching broken backend is reported.
    __lh_ips_backends:
      - {match: firewallcmd, missing: firewalld not running,
         broken: "{{ __lh_ips_firewalld.status.ActiveState | default('') != 'active' }}"}
      - {match: nftables, missing: nft not installed, broken: "{{ 'nft' not in __lh_ips_bins.stdout }}"}
      - {match: iptables, missing: iptables not installed, broken: "{{ 'iptables' not in __lh_ips_bins.stdout }}"}
    __lh_ips_action_findings: >-
      {%- set out = [] -%}
      {%- for a in (__lh_ips_actions.stdout_lines | default([]) | last | default('')).split(',')
                   | map('trim') | select -%}
      {%- set b = __lh_ips_backends | selectattr('match', 'in', a) | selectattr('broken') | first | default(none) -%}
      {%- if b -%}
      {%- set _ = out.append({'key': 'ban action ' ~ a ~ ' usable', 'expected': 'its firewall backend works',
                              'actual': b.missing ~ ' (reported only: bans would not reach the firewall;'
                                        ~ ' the firewall belongs to firewall_hardening)',
                              'fixable': false}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out | to_json }}

- name: audit | Report intrusion_prevention result
  ansible.builtin.debug:
    msg: "{{ 'COMPLIANT' if linux_hardening_ips_findings | length == 0 else linux_hardening_ips_findings }}"

- name: audit | Fail on findings
  ansible.builtin.fail:
    msg: "intrusion_prevention found {{ linux_hardening_ips_findings | length }} deviation(s)."
  when:
    - not (__lh_ips_audit_fatal | default(false))
    - linux_hardening_fail_on_error | bool
    - linux_hardening_ips_findings | length > 0

# After remediation only fixable findings fail the run; a container needs a human.
- name: audit | Fail on fixable findings left after remediation
  ansible.builtin.fail:
    msg: "intrusion_prevention left {{ __lh_ips_left | length }} fixable deviation(s) after remediation."
  vars:
    __lh_ips_left: "{{ linux_hardening_ips_findings | selectattr('fixable') | list }}"
  when:
    - __lh_ips_audit_fatal | default(false)
    - __lh_ips_left | length > 0
